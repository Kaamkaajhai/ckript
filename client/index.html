    <!-- Brand webfonts (match the landing hero): Baskervville for display
         headings, PT Serif for body. Loaded once, globally, so every surface —
         landing, auth modal, producer onboarding — renders in the brand face on
         first paint instead of racing a per-component <link> injection. The id
         is shared with the modals' ensure*Fonts() helpers so they no-op. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="ckript-authmodal-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap"
    />
    <meta
      name="description"
      content="Discover scripts, generate AI concept trailers, connect with producers and investors using Ckript's AI-powered entertainment marketplace."
    />
    <meta
      name="keywords"
      content="Ckript, script marketplace, screenplay analysis, AI script analysis, AI concept trailer, film funding, script discovery, screenplay submission, script pitching, AI filmmaking"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://ckript.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ckript" />

      property="og:description"

    <meta property="og:image" content="https://ckript.com/ckript-logo-landscape-nobg.png" />

      name="twitter:description"
      content="Discover scripts, generate AI concept trailers, connect with producers and investors using Ckript's AI-powered entertainment marketplace."

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

          "@type": "SearchAction",
          "target": "https://ckript.com/search?q={search_term_string}",
